<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>赛博逃避合理化生成器</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a1a; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: linear-gradient(180deg, #222 0%, #1a1a1a 100%); }
        .message { padding: 12px 16px; border-radius: 12px; max-width: 85%; line-height: 1.6; font-size: 15px; animation: fadeIn 0.3s ease; }
        .user { align-self: flex-end; background: #00ffcc; color: #000; border-bottom-right-radius: 2px; }
        .system { align-self: flex-start; background: #333; color: #eee; border-bottom-left-radius: 2px; border: 1px solid #444; }
        #action-area { padding: 15px; background: #252525; border-top: 1px solid #333; display: flex; gap: 10px; }
        input { flex: 1; background: #111; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 8px; outline: none; }
        button { background: #00ffcc; color: #000; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .opt-btn { flex: 1; height: 44px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-a { background: #444; color: #fff; }
        .btn-b { background: #ff00ff; color: #fff; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="chat-window">
        <div class="message system">【赛博拉扯大师】你好。今天又有什么想逃避的事情吗？</div>
    </div>
    <div id="action-area">
        <input type="text" id="user-input" placeholder="输入你想逃避的事...">
        <button id="send-btn">开启拉扯</button>
    </div>
   <script >
       console.log("！！！报告！脚本已经成功加载了！！！");
const apiKey = 'sk-a22dce5be3a4414b912ff266a071dc05'; // ⭐ 记得填入你的 Key

const chatWindow = document.getElementById('chat-window');
const actionArea = document.getElementById('action-area');

let round = 1; 
let userTask = ""; 

// --- 战绩统计小账本 ---
const stats = {
    getTodayKey: () => new Date().toLocaleDateString(),
    save: (type) => {
        const today = stats.getTodayKey();
        let data = JSON.parse(localStorage.getItem('vibe_stats') || '{}');
        if (!data[today]) data[today] = { success: 0, fail: 0 };
        data[today][type]++;
        localStorage.setItem('vibe_stats', JSON.stringify(data));
    },
    getToday: () => JSON.parse(localStorage.getItem('vibe_stats') || '{}')[stats.getTodayKey()] || { success: 0, fail: 0 }
};

// 页面加载显示今日数据
window.onload = () => {
    const d = stats.getToday();
    if (d.success > 0 || d.fail > 0) {
        addLog('system', `【今日战绩】你已成功被劝回 ${d.success} 次，彻底摆烂 ${d.fail} 次。加油，打工人！`);
    }
};

async function callAI(content, systemPrompt) {
    try {
      async function callAI(content, systemPrompt) {
    try {
        const url = 'https://api.deepseek.com/chat/completions';
        console.log("正在请求地址:", url);
        
        const res = await fetch(url, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json', 
                'Authorization': `Bearer ${apiKey.trim()}` 
            },
            body: JSON.stringify({
                model: "deepseek-chat",
                messages: [
                    { role: "system", content: systemPrompt }, 
                    { role: "user", content: content }
                ],
                temperature: 0.8
            })
        });

        if (!res.ok) {
            // 如果这里报错，控制台会打印出具体的错误代码（比如 401, 404, 500）
            console.error("服务器响应异常，状态码:", res.status);
            return `拉扯断线！错误码: ${res.status}。请确认API Key是否正确或余额是否充足。`;
        }

        const data = await res.json();
        return data.choices[0].message.content;
    } catch (e) { 
        console.error("网络请求彻底失败:", e);
        return `网络波动，无法连接到DeepSeek。原因: ${e.message}`; 
    }
}
        const data = await res.json();
        return data.choices[0].message.content;
    } catch (e) { return "网络波动，拉扯断线了..."; }
}

function addLog(role, text) {
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.innerText = text;
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
}

function createOptions(btnAText, btnBText) {
    actionArea.innerHTML = ''; 
    const btnA = document.createElement('button');
    btnA.className = 'opt-btn btn-a';
    btnA.innerText = btnAText;
    btnA.onclick = () => handleChoice('A'); 
    const btnB = document.createElement('button');
    btnB.className = 'opt-btn btn-b';
    btnB.innerText = btnBText;
    btnB.onclick = () => handleChoice('B'); 
    actionArea.appendChild(btnA);
    actionArea.appendChild(btnB);
}

async function handleChoice(type) {
    if (type === 'A') {
        stats.save('success');
        addLog('user', "好吧，我去做了。");
        addLog('system', `【拉扯成功】去吧！今日已成功自律 ${stats.getToday().success} 次！`);
        setTimeout(resetToInput, 3000);
    } else {
        round++;
        if (round > 3) {
            stats.save('fail');
            addLog('user', "就是不去！");
            addLog('system', `【拉扯失败】你赢了，去摆烂吧。今日累计摆烂 ${stats.getToday().fail} 次。`);
            setTimeout(resetToInput, 3000);
        } else {
            addLog('user', "我不去，继续拉扯。");
            processStep();
        }
    }
}

async function processStep() {
    let prompt = "";
    if (round === 1) prompt = `针对“${userTask}”，分析语义，给4个逃避理由并温和劝导。最后问：要去吗？`;
    else if (round === 2) prompt = `用户针对“${userTask}”死不悔改。严厉教训，指出不行动的严重后果。问：到底去不去？`;
    else if (round === 3) prompt = `用户意志铁石心肠。请卑微地、跪求地动之以情晓之以理。最后问：求你了去一次好吗？`;
    
    const reply = await callAI(userTask, prompt);
    addLog('system', reply);
    createOptions("被说服了", "就是不去");
}

function resetToInput() {
    round = 1;
    actionArea.innerHTML = `<input type="text" id="user-input" placeholder="输入你想逃避的事..."><button id="send-btn">开启拉扯</button>`;
    document.getElementById('send-btn').onclick = startApp;
}

async function startApp() {
    const input = document.getElementById('user-input');
    userTask = input.value.trim();
    if (!userTask) return;
    addLog('user', `我不想：${userTask}`);
    input.value = '';
    processStep();
}

document.getElementById('send-btn').onclick = startApp;
       const apiKey ='sk-a22dce5be3a4414b912ff266a071dc05'
   </script>
</body>
</html>
