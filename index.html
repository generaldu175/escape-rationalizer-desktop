<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>赛博逃避拉扯大师</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #e0e0e0; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #stats-bar { font-size: 12px; color: #888; text-align: center; padding: 8px; background: #1a1a1a; border-bottom: 1px solid #333; }
        #chat-window { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px; border-radius: 12px; max-width: 85%; line-height: 1.5; font-size: 14px; }
        .user { align-self: flex-end; background: #00ffcc; color: #000; }
        .system { align-self: flex-start; background: #2c2c2c; border: 1px solid #444; }
        #action-area { padding: 15px; background: #1a1a1a; border-top: 1px solid #333; display: flex; gap: 8px; }
        input { flex: 1; background: #000; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 8px; outline: none; }
        button { background: #00ffcc; color: #000; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .opt-btn { flex: 1; height: 44px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .btn-a { background: #444; color: #fff; }
        .btn-b { background: #ff00ff; color: #fff; }
    </style>
</head>
<body>
    <div id="stats-bar">今日战报加载中...</div>
    <div id="chat-window"><div class="message system">【拉扯大师】已就绪。说吧，今天又想逃避什么？</div></div>
    <div id="action-area">
        <input type="text" id="user-input" placeholder="输入你想逃避的事...">
        <button id="send-btn">开启拉扯</button>
    </div>

    <script>
        // --- 核心逻辑 (只定义一次 apiKey) ---
        const apiKey = 'sk-a22dce5be3a4414b912ff266a071dc05'; 

        let round = 1;
        let userTask = "";
        const chatWindow = document.getElementById('chat-window');
        const actionArea = document.getElementById('action-area');
        const statsBar = document.getElementById('stats-bar');

        const stats = {
            getTodayKey: () => new Date().toLocaleDateString(),
            save: (type) => {
                const today = stats.getTodayKey();
                let data = JSON.parse(localStorage.getItem('pull_stats_v2') || '{}');
                if (!data[today]) data[today] = { success: 0, fail: 0 };
                data[today][type]++;
                localStorage.setItem('pull_stats_v2', JSON.stringify(data));
                updateUI();
            },
            getToday: () => JSON.parse(localStorage.getItem('pull_stats_v2') || '{}')[stats.getTodayKey()] || { success: 0, fail: 0 }
        };

        function updateUI() {
            const d = stats.getToday();
            statsBar.innerText = `📅 今日：成功劝回 ${d.success} | 彻底摆烂 ${d.fail}`;
        }

        window.onload = updateUI;

        async function callAI(content, systemPrompt) {
            try {
                const res = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey.trim()}` },
                    body: JSON.stringify({ model: "deepseek-chat", messages: [{ role: "system", content: systemPrompt }, { role: "user", content: content }], temperature: 0.8 })
                });
                const data = await res.json();
                return data.choices[0].message.content;
            } catch (e) { return "连接失败：" + e.message; }
        }

        function addLog(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerText = text;
            chatWindow.appendChild(div);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function createOptions(btnAText, btnBText) {
            actionArea.innerHTML = ''; 
            const btnA = document.createElement('button'); btnA.className = 'opt-btn btn-a'; btnA.innerText = btnAText;
            btnA.onclick = () => handleChoice('A'); 
            const btnB = document.createElement('button'); btnB.className = 'opt-btn btn-b'; btnB.innerText = btnBText;
            btnB.onclick = () => handleChoice('B'); 
            actionArea.appendChild(btnA); actionArea.appendChild(btnB);
        }

        async function handleChoice(type) {
            if (type === 'A') {
                stats.save('success');
                addLog('system', "拉扯成功！快去行动吧。");
                setTimeout(resetToInput, 2500);
            } else {
                round++;
                if (round > 3) {
                    stats.save('fail');
                    addLog('system', "你赢了，去摆烂吧。");
                    setTimeout(resetToInput, 2500);
                } else { processStep(); }
            }
        }

        async function processStep() {
            addLog('system', "思考中...");
            let p = round === 1 ? `针对“${userTask}”给4个借口并劝导` : (round === 2 ? `严厉教导后果` : `卑微跪求`);
            const reply = await callAI(userTask, p);
            chatWindow.removeChild(chatWindow.lastChild);
            addLog('system', reply);
            createOptions("被说服了", "就是不去");
        }

        function resetToInput() {
            round = 1;
            actionArea.innerHTML = `<input type="text" id="user-input" placeholder="输入你想逃避的事..."><button id="send-btn">开启拉扯</button>`;
            document.getElementById('send-btn').onclick = startApp;
        }

        function startApp() {
            const input = document.getElementById('user-input');
            userTask = input.value.trim();
            if (!userTask) return;
            addLog('user', userTask);
            input.value = '';
            processStep();
        }

        document.getElementById('send-btn').onclick = startApp;
    </script>
</body>
</html>
